# Render blueprint for PACOS (pacos/docs/DEPLOYMENT.md explains the choices).
# Free-tier deployment: one Docker web service (API + dashboard), with the
# tracker in a free external Postgres (Neon/Supabase) via DATABASE_URL so
# nothing critical lives on the free instance's ephemeral filesystem.
# Trade-offs: the service sleeps after ~15 idle minutes (cold start on next
# visit), and generated asset files/leads.csv on disk reset on restart — the
# Postgres tracker (leads + pipeline state) is what persists.
services:
  - type: web
    name: pacos
    runtime: docker
    plan: free
    dockerfilePath: ./pacos/Dockerfile
    dockerContext: ./pacos
    healthCheckPath: /api/health
    autoDeploy: true # every push to the tracked branch redeploys (CI/CD)
    envVars:
      # ── secrets: fill in the Render dashboard (sync: false = never in git) ──
      - key: DATABASE_URL # Neon/Supabase Postgres connection string
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      # Access token the dashboard asks for on first load. Render mints a
      # random value at blueprint creation; read it from the dashboard.
      - key: PACOS_AUTH_TOKEN
        generateValue: true
      # ── candidate identity (not secret, but personal — set in dashboard) ──
      - key: CANDIDATE_NAME
        sync: false
      - key: CANDIDATE_HEADLINE
        sync: false
      - key: CANDIDATE_EMAIL
        sync: false
      - key: CANDIDATE_LINKEDIN
        sync: false
