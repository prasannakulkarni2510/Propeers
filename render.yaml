# Render blueprint for PACOS (pacos/docs/DEPLOYMENT.md explains the choices).
# One Docker web service serves the API and the dashboard; the workspace
# (leads.csv, tracker.db, generated assets) lives on a persistent disk at
# /data. Secrets are set in the Render dashboard, never committed.
services:
  - type: web
    name: pacos
    runtime: docker
    plan: starter # persistent disks need a paid instance; starter is the cheapest
    dockerfilePath: ./pacos/Dockerfile
    dockerContext: ./pacos
    healthCheckPath: /api/health
    autoDeploy: true # every push to the tracked branch redeploys (CI/CD)
    disk:
      name: pacos-data
      mountPath: /data
      sizeGB: 1
    envVars:
      # ── secrets: fill in the Render dashboard (sync: false = never in git) ──
      - key: NVIDIA_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      # Access token the dashboard asks for on first load. Render mints a
      # random value at blueprint creation; read it from the dashboard.
      - key: PACOS_AUTH_TOKEN
        generateValue: true
      # ── candidate identity (not secret, but personal — set in dashboard) ──
      - key: CANDIDATE_NAME
        sync: false
      - key: CANDIDATE_HEADLINE
        sync: false
      - key: CANDIDATE_EMAIL
        sync: false
      - key: CANDIDATE_LINKEDIN
        sync: false
      # ── workspace paths: everything mutable lives on the persistent disk ──
      - key: LEADS_CSV_PATH
        value: /data/leads.csv
      - key: TRACKER_CSV_PATH
        value: /data/tracker.csv
      - key: NEW_JOBS_CSV_PATH
        value: /data/new_jobs.csv
      - key: OUTPUT_DIR
        value: /data/output
      - key: BASE_CV_PATH
        value: /data/base_cv.txt
      - key: GMAIL_CREDENTIALS_PATH
        value: /data/credentials.json
      - key: GMAIL_TOKEN_PATH
        value: /data/token.json
